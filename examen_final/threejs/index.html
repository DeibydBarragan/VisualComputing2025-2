<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Final - Three.js Escena 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #2c3e50;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Panel de controles */
        .controls-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .controls-panel h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 20px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            background: #34495e;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #2c3e50;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: #7f8c8d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn.secondary:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #95a5a6;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        /* Indicador de cámara activa */
        .camera-indicator {
            display: inline-block;
            padding: 5px 12px;
            background: #27ae60;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Info corner */
        .info-corner {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 12px;
            max-width: 300px;
        }

        .info-corner h3 {
            margin-bottom: 8px;
            color: #3498db;
            font-size: 14px;
        }

        .info-corner ul {
            list-style: none;
            padding: 0;
        }

        .info-corner li {
            margin: 5px 0;
            padding-left: 15px;
            position: relative;
        }

        .info-corner li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #3498db;
        }

        /* Loading screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <h2>Controles</h2>
        
        <div class="control-group">
            <label>Perspectivas de Cámara:</label>
            <button class="btn" id="camera1-btn">Vista General</button>
            <button class="btn" id="camera2-btn">Vista Superior</button>
            <button class="btn secondary" id="camera3-btn">Vista Lateral</button>
            <div class="camera-indicator" id="camera-indicator">Cámara: General</div>
        </div>

        <div class="control-group">
            <label>Controles de Animación:</label>
            <button class="btn secondary" id="toggle-animation">Pausar Animaciones</button>
        </div>

        <div class="control-group">
            <p class="info-text">
                Usa el mouse para rotar, zoom y mover la camara con OrbitControls
            </p>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
